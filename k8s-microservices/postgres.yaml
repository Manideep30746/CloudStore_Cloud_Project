apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudstore-db
  namespace: cloudstore-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudstore-db
  template:
    metadata:
      labels:
        app: cloudstore-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: cloudstore
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudstore-db-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d cloudstore"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d cloudstore"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: cloudstore-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudstore-db-pvc
  namespace: cloudstore-ms
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cloudstore-db
  namespace: cloudstore-ms
spec:
  selector:
    app: cloudstore-db
  ports:
    - port: 5432
      targetPort: 5432
