services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      POSTGRES_DB: cloudstore
    ports: ["5435:5432"]
    volumes:
      - cloudstore_ms_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudstore"]
      interval: 5s
      timeout: 5s
      retries: 10
  inventory-service:
    build: ./services/inventory-service
    environment: &db-env
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      DB_NAME: cloudstore
      PORT: 5000
    depends_on: {db: {condition: service_healthy}}
  order-service:
    build: ./services/order-service
    environment: *db-env
    depends_on: {db: {condition: service_healthy}}
  user-service:
    build: ./services/user-service
    environment: *db-env
    depends_on: {db: {condition: service_healthy}}
  api-gateway:
    build: ./services/api-gateway
    environment:
      PORT: 5000
      INVENTORY_URL: http://inventory-service:5000
      ORDER_URL: http://order-service:5000
      USER_URL: http://user-service:5000
    ports: ["5001:5000"]
    depends_on: [inventory-service, order-service, user-service]
volumes:
  cloudstore_ms_data:
