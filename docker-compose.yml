
services:
  db:
    image: postgres:17-alpine
    container_name: cloudstore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      POSTGRES_DB: cloudstore
    ports:
      - "5434:5432"
    volumes:
      - cloudstore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cloudstore-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      DB_NAME: cloudstore
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cloudstore_data:
