
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudstore-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudstore-db
  template:
    metadata:
      labels:
        app: cloudstore-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: cloudstore
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudstore-db-secret
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: cloudstore-db
spec:
  selector:
    app: cloudstore-db
  ports:
    - port: 5432
      targetPort: 5432
